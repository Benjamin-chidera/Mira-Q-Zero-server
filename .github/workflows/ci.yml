name: Server CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync Dependencies
        run: uv sync --frozen

      - name: Run Tests
        env:
          REDIS_URL: redis://localhost:6379/0
          TESTING: "True"
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: uv run pytest

  deploy:
    name: Deploy to Hostinger VPS
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            # Check if directory exists, if not clone it
            if [ ! -d "/root/Mira-Q-Zero-server" ]; then
              git clone https://github.com/Benjamin-chidera/Mira-Q-Zero-server.git /root/Mira-Q-Zero-server
            fi
            
            cd /root/Mira-Q-Zero-server
            
            # Pull latest changes
            git fetch --all
            git reset --hard origin/main
            
            # Rebuild and restart services
            docker compose down
            docker compose up -d --build
            
            # Optional: Clean up unused Docker images/containers to save space
            docker image prune -f
