name: Server CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─── Job 1: Run the test suite ────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync Dependencies
        run: uv sync --frozen

      - name: Run Tests
        env:
          REDIS_URL: redis://localhost:6379/0
          TESTING: "True"
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: uv run pytest

  # ─── Job 2: Build Docker image and push to Docker Hub ─────────────────────
  # This runs on a GitHub-hosted runner — the VPS never builds anything.
  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Image: discoverbenix/gp-connect-server:latest
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/gp-connect-server:latest
          # Build for the VPS architecture (linux/amd64)
          platforms: linux/amd64
          # Reuse layer cache between runs to speed up builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 3: Tell Dokploy to pull the new image and redeploy ───────────────
  trigger-deploy:
    name: Trigger Dokploy Deployment
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Trigger deployment via Dokploy API
        run: |
          curl --fail -X POST \
            "${{ secrets.DOKPLOY_URL }}/api/application.deploy" \
            -H "accept: application/json" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"applicationId": "${{ secrets.DOKPLOY_APP_ID }}"}'
