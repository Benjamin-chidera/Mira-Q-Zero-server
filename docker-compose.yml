name: gp-connect

services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy
    container_name: gp-connect-nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
    restart: always

  acme-companion:
    image: nginxproxy/acme-companion
    container_name: gp-connect-acme-companion
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/etc/nginx/certs:rw
      - vhost:/etc/nginx/vhost.d:rw
      - html:/usr/share/nginx/html:rw
      - acme:/etc/acme.sh
    environment:
      - DEFAULT_EMAIL=admin@gpconnect.nhs.uk
      - NGINX_PROXY_CONTAINER=gp-connect-nginx-proxy
    depends_on:
      - nginx-proxy
    restart: always

  web:
    build: .
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DATABASE_URL=${DATABASE_URL:-mysql+pymysql://${MYSQL_USER:-gpuser}:${MYSQL_PASSWORD:-gppassword}@db:3306/${MYSQL_DATABASE:-gpconnect}}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@gpconnect.nhs.uk}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-AdminPass123!}
      - ADMIN_NAME=${ADMIN_NAME:-System Administrator}
      - VIRTUAL_HOST=gp-connect.discoverbenix.com
      - VIRTUAL_PORT=8000
      - LETSENCRYPT_HOST=gp-connect.discoverbenix.com
      - LETSENCRYPT_EMAIL=admin@gpconnect.nhs.uk
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy

  worker:
    build: .
    command: celery -A celery_worker.celery_app worker --loglevel=info
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DATABASE_URL=${DATABASE_URL:-mysql+pymysql://${MYSQL_USER:-gpuser}:${MYSQL_PASSWORD:-gppassword}@db:3306/${MYSQL_DATABASE:-gpconnect}}
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    volumes:
      - gp_connect_redis_data:/data

  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gpconnect}
      MYSQL_USER: ${MYSQL_USER:-gpuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gppassword}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gprootpassword}
    volumes:
      - gp_connect_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      timeout: 5s
      retries: 5
      interval: 5s

volumes:
  gp_connect_redis_data:
  gp_connect_db_data:
  certs:
  vhost:
  html:
  acme:
